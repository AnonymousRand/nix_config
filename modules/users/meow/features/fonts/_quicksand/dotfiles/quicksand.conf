<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <test name="family" compare="contains">
      <string>Quicksand</string>
    </test>
    <edit name="weight" mode="assign">
      <int>100</int>
    </edit>
  </match>
</fontconfig>
